<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Appointment | Medino</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWix+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkR4j8RykV5zsxgA0zYxL4x6Ck4WfE2x2QwA==" crossorigin="anonymous" referrerpolicy="no-referrer">
	<link rel="stylesheet" href="style.css">
	<link rel="stylesheet" href="subpages.css">
	<link rel="stylesheet" href="footer.css">
</head>
<body class="subpage">
	<div id="site-navbar"></div>

	<main class="page-main">
		<section class="page-banner">
			<div class="container">
				<h1>Appointment</h1>
				<p>Schedule your visit with the right clinic and preferred time slot. We will confirm your booking quickly.</p>
			</div>
		</section>

		<section class="container" aria-label="Appointment booking form">
			<div class="form-panel panel">
				<h2 class="section-title">Book Appointment</h2>
				<form class="form-grid" action="#" method="post">
					<div class="form-group">
						<label for="name">Name</label>
						<input id="name" name="name" type="text" placeholder="Enter your full name" required>
					</div>
					<div class="form-group">
						<label for="phone">Phone</label>
						<input id="phone" name="phone" type="tel" placeholder="Enter phone number" required>
					</div>
					<div class="form-group">
						<label for="email">Email</label>
						<input id="email" name="email" type="email" placeholder="Enter your email" required>
					</div>
					<div class="form-group">
						<label for="clinic">Clinic Selection</label>
						<select id="clinic" name="clinic" required>
							<option value="">Select clinic</option>
							<option value="tolani-ganjmal">Tolani Clinic - Ganjmal</option>
							<option value="vijan-canada-corner">Vijan Hospital - Canada Corner</option>
							<option value="dr-tolani-nashik">Dr Tolani Clinic - Nashik</option>
						</select>
					</div>
					<div class="form-group">
						<label for="date">Date</label>
						<input id="date" name="date" type="date" required>
					</div>
					<div class="form-group">
						<label for="time">Time</label>
						<input id="time" name="time" type="time" required>
					</div>
					<div class="form-group span-2">
						<label for="message">Message</label>
						<textarea id="message" name="message" placeholder="Add symptoms or preferred consultation notes"></textarea>
					</div>
					<div class="form-actions span-2">
						<button class="hero-btn" type="submit">Confirm Appointment</button>
					</div>
				</form>
			</div>
		</section>

		<div id="site-footer"></div>
	</main>
	<script src="preloader.js"></script>
	<script src="navbar-loader.js"></script>
	<script src="footer-loader.js"></script>
</body>
</html>
