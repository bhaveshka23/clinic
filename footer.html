<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Clinic Footer</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWix+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkR4j8RykV5zsxgA0zYxL4x6Ck4WfE2x2QwA==" crossorigin="anonymous" referrerpolicy="no-referrer">
	<link rel="stylesheet" href="footer.css">
</head>
<body>
	<footer class="clinic-footer" aria-label="Site footer">
		<div class="clinic-footer-pulse" aria-hidden="true"></div>
		<div class="container clinic-footer-top">
			<div class="clinic-footer-col">
				<h3>TOP PRODUCTS</h3>
				<ul>
					<li><a href="#">Managed Website</a></li>
					<li><a href="#">Managed Reputation</a></li>
					<li><a href="#">Power Tools</a></li>
					<li><a href="#">Marketing Service</a></li>
				</ul>
			</div>

			<div class="clinic-footer-col clinic-newsletter-col">
				<h3>NEWSLETTER</h3>
				<p>You can trust us. We only send health tips, updates, and helpful offers.</p>
				<form class="clinic-newsletter-form" action="#" method="post">
					<input type="email" placeholder="Your email here" aria-label="Email for newsletter" required>
					<button type="submit">SUBSCRIBE NOW</button>
				</form>
			</div>
		</div>

		<div class="container clinic-footer-bottom">
			<p>Copyright &copy;2026 All rights reserved | Designed for better care journeys.</p>
			<div class="clinic-social-links" aria-label="Social links">
				<a href="#" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
				<a href="#" aria-label="Twitter"><i class="fa-brands fa-twitter"></i></a>
				<a href="#" aria-label="Dribbble"><i class="fa-brands fa-dribbble"></i></a>
				<a href="#" aria-label="Behance"><i class="fa-brands fa-behance"></i></a>
			</div>
		</div>
	</footer>
</body>
</html>
